name: Verify storefront
on:
  push:
    branches: [main, 'codex/change18-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Serverless cold-start guards
        run: bun run test:auth:cold-start
      - name: Production build
        run: bun run build
      - name: Production authentication HTTP smoke checks
        run: bun run test:auth:http
      - name: Type check without incremental cache
        run: bun run lint --incremental false
